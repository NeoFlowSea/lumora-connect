name: Rebuild site for a design branch

# A push to design/<name> re-runs the main deploy, which publishes every
# design branch in its own subfolder. Deploys always run from main.

on:
  push:
    branches: ["design/**"]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
